[package]
name = "sqlx-pg-copy"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "Binary COPY ... FROM STDIN encoder for sqlx's Postgres driver"
repository = "https://github.com/srijs/sqlx-pg-copy"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["postgres", "sqlx", "copy", "bulk-insert", "database"]
categories = ["database"]
exclude = [".github/"]

[dependencies]
sqlx = { version = "0.9", default-features = false, features = ["postgres"] }
thiserror = "2"

[dev-dependencies]
anyhow = "1"
criterion = { version = "0.8", features = ["async_tokio"] }
proptest = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
] }

[[bench]]
name = "copy_in"
harness = false

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
